<title>Fight &amp; Mass Training Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--tx:#ece9e3;--mute:#8e8a84;--line:#2a2a2a;--head:#151515;--chip:#1c1c1c;--acc:#e0623f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:44px;line-height:1.08;letter-spacing:-.01em;margin:8px 0 14px}
h2{font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:30px;line-height:1.15;margin:0}
p{margin:12px 0}
b{font-weight:700}
a{color:var(--tx);text-decoration:underline;text-decoration-color:#5a5752;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--chip);border-radius:8px;padding:3px 10px;font-size:15px;color:#d9d5ce;white-space:nowrap}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.banner{border-left:3px solid var(--acc);background:#171310;border-radius:8px;padding:12px 14px;margin:14px 0;font-size:16px}
.banner b{color:#f1b39f}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0}
summary::-webkit-details-marker{display:none}
summary i{flex:0 0 12px;width:12px;height:12px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translate(-3px,-3px);transition:transform .2s}
details[open]>summary i{transform:rotate(225deg) translate(-3px,-3px)}
.inner{overflow:hidden}
.inner>:last-child{margin-bottom:0}
.sec>.inner{padding:0 0 18px}
details.sub{border-top:1px solid #1e1e1e}
.sub summary{padding:16px 0}
.sub summary span.t{font-weight:700;font-size:18px}
.sub .inner{padding:0 0 10px}
.tw{overflow-x:auto;margin:14px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top;font-size:16px}
th{background:var(--head);color:#bdb8b0;font-weight:500}
td.w{font-weight:600;min-width:84px}
td.s{white-space:nowrap}
ul,ol{padding-left:24px;margin:12px 0}
li{margin:7px 0}
.top{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.top button{background:var(--chip);color:#cfcac2;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.tag{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:#0b0b0b;background:#ece9e3;border-radius:6px;padding:2px 7px;vertical-align:middle}
.tag.acc{background:var(--acc);color:#fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#ece9e3;color:#0b0b0b;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal div{background:#151515;border-radius:14px;padding:16px;width:100%;max-width:560px}
.modal textarea{width:100%;height:50vh;background:#0b0b0b;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;-webkit-user-select:text;user-select:text}
.modal button{margin-top:10px;width:100%;background:var(--tx);color:#0b0b0b;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px}
.top button.on{background:var(--tx);color:#0b0b0b}
.edpanel{background:#141414;border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0 14px;font-size:15px}
.edpanel label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;color:#cfcac2}
.edpanel input{background:#0b0b0b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;-webkit-user-select:text;user-select:text}
.edpanel button{background:var(--chip);color:#cfcac2;border:0;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;margin-top:4px}
.edpanel button.warn{background:#5a1f12;color:#ffd9cc}
.stp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stp button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--tx);font-size:19px;font-weight:700;line-height:1;padding:0}
.stp .sv{min-width:44px;text-align:center}
.pill{background:var(--chip);color:#ece9e3;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700}
.foot{color:var(--mute);font-size:13px;padding-top:18px;border-top:1px solid var(--line)}
</style></head>
<body><div class="wrap" id="app"><h1>Fight &amp; Mass Training Plan</h1><p style="color:#8e8a84">Loading…</p></div>
<div class="toast" id="toast">Copied</div>

u20135 min on top sets, 2\u20133 min on other heavy sets, 60\u201390 sec on small lifts.<\/li><li><b>Last set of small lifts:<\/b> go close to failure.<\/li><li><b>Sleep:<\/b> 8\u20139 hours. Muscle grows when you sleep.<\/li><li><b>Every 4th week:<\/b> test week. Monday: test a new bench single. Everything else at about 70% weight and half the fight rounds. Then start the next 4 weeks.<\/li><li><b>Joint pain or always wiped out:<\/b> take a lighter week.<\/li><\/ol>", "Punch & kick power": "<p>Power comes from the ground up through your hips. Arms alone are weak.<\/p><ul><li><b>Ground force:<\/b> push off the floor with your feet on every strike.<\/li><li><b>Hip rotation:<\/b> turn the hips first, then the shoulder and fist follow.<\/li><li><b>Loose, then snap:<\/b> stay relaxed until impact. Tense muscles are slow.<\/li><li><b>Kicks:<\/b> pivot on the ball of the standing foot and turn the hip over.<\/li><li><b>Max-speed reps:<\/b> every rep fast. Slow reps teach slow strikes.<\/li><li><b>Explosive training:<\/b> box jumps, broad jumps, med ball rotational throws, slams.<\/li><li><b>Heavy legs:<\/b> squats, deadlifts and hip thrusts build punch and kick power.<\/li><li><b>Neck and core:<\/b> so you can take a hit.<\/li><\/ul>", "Bench plan": "<p>Bench twice a week: heavy on Monday, paused speed work on Friday.<\/p><div class=\"tw\"><table><tr><th>Day<\/th><th>Lift<\/th><th>Sets \u00d7 Reps<\/th><th>Weight<\/th><th>Progression<\/th><\/tr><tr><td>Monday<\/td><td>Bench top set<\/td><td>1 \u00d7 3<\/td><td>Start 155 lb<\/td><td>+5 lb each week<\/td><\/tr><tr><td>Monday<\/td><td>Bench press<\/td><td>5 \u00d7 5<\/td><td>Start 135 lb<\/td><td>+5 lb when all 25 reps are hit<\/td><\/tr><tr><td>Friday<\/td><td>Paused bench<\/td><td>4 \u00d7 6<\/td><td>Start 115 lb (75% of Monday)<\/td><td>Pause 1 sec on the chest<\/td><\/tr><tr><td>Every 4th Monday<\/td><td>Bench single (test)<\/td><td>1 \u00d7 1<\/td><td>180, then 185, 190\u2026<\/td><td>Replaces the top set that day<\/td><\/tr><\/table><\/div><p><b>Form:<\/b> shoulder blades squeezed back, feet driving into the floor, bar touches the lower chest, press up and slightly back.<\/p><p><b>Helpers:<\/b> dips, close-grip bench, skullcrushers and rows keep shoulders healthy and build lockout.<\/p>", "Stamina progression": "<p>Build up to 12 hard rounds by month 4 with short, intense work, so you keep the calories you need for mass.<\/p><div class=\"tw\"><table><tr><th>Month<\/th><th>Bag / sparring rounds<\/th><th>Round length / rest<\/th><th>Sprints (Tue)<\/th><\/tr><tr><td>1<\/td><td>6<\/td><td>3 min / 1 min<\/td><td>8 \u00d7 100 m<\/td><\/tr><tr><td>2<\/td><td>8<\/td><td>3 min / 1 min<\/td><td>10 \u00d7 100 m<\/td><\/tr><tr><td>3<\/td><td>10<\/td><td>3 min / 45 sec<\/td><td>10 \u00d7 150 m<\/td><\/tr><tr><td>4+<\/td><td>12<\/td><td>3 min / 30 sec<\/td><td>12 \u00d7 150 m<\/td><\/tr><\/table><\/div>"};

    H+='<div class="banner"><b>Pec check:</b> if your right pec still hurts at all, use 10% less on every bench lift this week and skip dips and clap push-ups.</div>';
  } else if(c.cw===3){
    H+='<div class="banner"><b>Test week is next week.</b> Sleep and eat big.</div>';
  }
  // travel
  if(c.trip){
    var tin='<p>'+esc(c.trip.note)+'</p>';
    c.trip.days.forEach(function(d){
      var dt=parse(d.date), isT=d.date===c.tds;
      tin+=det("sub",' data-key="t'+d.date+'"'+(isT?' data-today="1"':''),'<span class="t">'+WD[dt.getDay()]+' '+md(dt)+': '+esc(d.t)+(isT?'<span class="tag">TODAY</span>':'')+'</span>',
        '<p><b>Cardio / Fight:</b> '+esc(d.rf)+'</p>'+table(d.ex.map(function(e){return {n:e.n,q:e.q,s:e.s,w:e.w}}),true));
    });
    H+=det("sec",' data-key="trip" data-auto="1"','<h2>'+esc(c.trip.title)+'</h2>',tin);
  }
  // weekly
  var win='<p>Same routine every week. Only the weights and rounds go up. Run in the morning; in the evening do fight training first, then lift. Tap an exercise to see how-to videos.</p>';
  var todayName=WD[c.today.getDay()], openDay=c.sundayPreview?"Monday":todayName;
  DAYS.forEach(function(day){
    var isT=!c.trip && day.d===openDay, tag=isT?(c.sundayPreview?'<span class="tag">TOMORROW</span>':'<span class="tag">TODAY</span>'):'';
    var title=day.d+': '+(c.test&&day.d==="Monday"?(SKIP_TEST.indexOf(c.w)>=0?"Light Push":"Bench Test"):c.test&&day.d!=="Sunday"&&day.d!=="Saturday"?"Light "+day.t.split("+").pop().trim():day.t);
    var body="";
    if(day.ex){ body='<p><b>Run / Fight:</b> '+esc(day.rf(c))+'</p>';
      if(c.test&&day.d==="Monday"&&SKIP_TEST.indexOf(c.w)<0) body+='<p><b>Bench warm-up:</b> bar × 10, 95 × 5, 135 × 3, 155 × 1, 165 × 1. Rest 3–5 min, then go.</p>';
      body+=table(rowsFor(day,c),true);
    } else body='<ul>'+day.list(c).map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>';
    win+=det("sub",' data-key="d'+day.d+'"'+(isT?' data-today="1"':''),'<span class="t">'+title+tag+'</span>',body);
  });
  H+=det("sec",' data-key="week" data-auto="1"','<h2>This week</h2>',win);
  // weights
  var wt='<p>Every weight on this page updates by itself: main lifts every week, smaller lifts every few weeks. Rounds, runs and sprints grow each month. Missed reps or something feels off? Tap Edit at the top and change it. No exact dumbbell? Use the closest one you have.</p><div class="tw"><table><tr><th>Lift</th><th>This week</th><th>Next week</th></tr>';
  Object.keys(NAMES).forEach(function(k){ var cur=(EDITING&&!c.test)?stepper("l:"+k,lift(k,c.w),"",5):liftLabel(k,c.w,c.block); wt+='<tr><td>'+NAMES[k]+'</td><td class="w">'+cur+'</td><td>'+liftLabel(k,c.w+1,Math.ceil((c.w+1)/4))+'</td></tr>'; });
  wt+='</table></div>';
  H+=det("sec",' data-key="weights"','<h2>Your weights</h2>',wt);
  // static notes
  ["Goals","Nutrition","Strength rules","Punch & kick power","Bench plan","Stamina progression"].forEach(function(k){
    if(STATIC[k]) H+=det("sec",' data-key="s'+k+'"','<h2>'+esc(k)+'</h2>',STATIC[k]);
  });
  H+='<div class="foot">Week 1 started '+md(parse(START))+', '+parse(START).getFullYear()+'. Test weeks every 4th week. Your edits are saved on this phone.</div>';
  return {html:H,c:c};
}
function renderShare(prerender){
  var c={test:false,rounds:6,rest:"1 min",sprints:"8 × 100 m",w:1,block:1,run:"2–3",run2:"3",hard:"3–4",intervals:10};
  var H='<div class="top" id="topbar"'+(prerender?' style="display:none"':'')+'><button data-a="open">Open all</button><button data-a="close">Close all</button></div>';
  H+='<h1>Fight Workout</h1><p style="color:var(--mute);margin-top:0">Boxing and kickboxing plus strength, 6 days a week. Tap any exercise to see how-to videos. Add weight when you hit every rep.</p>';
  var todayName=WD[new Date().getDay()];
  DAYS.forEach(function(day){
    var body="";
    if(day.ex){ body='<p><b>Run / Fight:</b> '+esc(day.rf(c))+'</p>'+table(day.ex.map(function(e){return {n:e.n,q:e.q,s:e.s}}),false); }
    else body='<ul>'+day.list(c).filter(function(x){return !/Anaverde/.test(x)}).map(function(x){return '<li>'+x+'</li>'}).join("")+'<li>Run 3–4 miles hard</li></ul>';
    H+=det("sec",' data-key="d'+day.d+'"'+(day.d===todayName?' data-today="1"':''),'<h2>'+day.d+'</h2><span style="flex:1;color:var(--mute);font-size:15px;text-align:right">'+esc(day.t)+'</span>',body);
  });
  return {html:H,c:c};
}
function copyText(c){
  var L=["FIGHT & MASS: WEEK "+c.w+(c.test?" (EASY WEEK)":""),""];
  if(c.trip){ L.push(c.trip.title.toUpperCase()); c.trip.days.forEach(function(d){var dt=parse(d.date);L.push("");L.push(WD[dt.getDay()].toUpperCase()+": "+d.t);L.push(d.rf);d.ex.forEach(function(e){L.push("- "+e.n+": "+e.s)})}); L.push("");L.push("NORMAL WEEK");}
  DAYS.forEach(function(day){
    L.push(""); L.push(day.d.toUpperCase()+": "+day.t);
    if(day.ex){ L.push(day.rf(c)); rowsFor(day,c).forEach(function(r){L.push("- "+r.n+": "+r.s)}); }
    else day.list(c).forEach(function(x){L.push("- "+x.replace(/<[^>]+>/g,""))});
  });
  return L.join("\n");
}
/* ================= UI ================= */
if(window.__PRERENDER){ var pr=(SHARE?renderShare(true):render(window.__NOW?new Date(window.__NOW):new Date(),true)); document.getElementById("app").innerHTML=pr.html; document.querySelectorAll("details").forEach(function(d){d.open=true}); return; }
var app=document.getElementById("app"), R=null, RESET_ARM=false, firstPaint=true;
function paint(){
  var openKeys=null;
  if(!firstPaint){ openKeys={}; app.querySelectorAll("details[open]").forEach(function(d){openKeys[d.getAttribute("data-key")]=1}); }
  var y=window.scrollY;
  R=SHARE?renderShare(false):render(new Date(),false); app.innerHTML=R.html;
  if(SITE&&SHOW_LINK){ var h1=app.querySelector("h1"); if(h1) h1.insertAdjacentHTML("afterend",linkBanner()); }
  app.querySelectorAll("details").forEach(function(d){
    d.open = openKeys ? !!openKeys[d.getAttribute("data-key")] : (d.getAttribute("data-auto")==="1" || d.getAttribute("data-today")==="1");
  });
  if(firstPaint && R.c.trip){var wk=app.querySelector('details[data-key="week"]'); if(wk) wk.open=false;}
  var si=document.getElementById("startin");
  if(si) si.addEventListener("change",function(){ if(/^\d{4}-\d\d-\d\d$/.test(si.value)){ EDITS.start=si.value; START=si.value; saveEdits(); paint(); toast("Start date saved"); } });
  if(!firstPaint) window.scrollTo(0,y);
  firstPaint=false;
}
function thisMonday(){ var t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate()); var d=t.getDay(); return ymd(addDays(t, d===0?1:1-d)); }
function myLink(){ return location.origin+location.pathname+"?me="+CODE; }
function newCode(){ var a="abcdefghijkmnpqrstuvwxyz23456789",s=""; var r=new Uint32Array(12); (window.crypto||{getRandomValues:function(x){for(var i=0;i<x.length;i++)x[i]=Math.random()*4e9;return x}}).getRandomValues(r); for(var i=0;i<12;i++) s+=a[r[i]%a.length]; return s; }
function useCode(code,fresh){
  CODE=code; EDIT_KEY="fightplan_edits_"+code;
  try{ localStorage.setItem("fightplan_code",code); }catch(e){}
  if(location.search.indexOf("me="+code)<0){ try{ history.replaceState(null,"","?me="+code); }catch(e){} }
}
function welcome(){
  app.innerHTML='<h1>Fight &amp; Mass Training Plan</h1><p>Your own boxing, kickboxing and strength plan. It updates itself every week: weights, test weeks, rounds and runs.</p>'+
   '<div class="edpanel"><button data-a="start" style="background:var(--tx);color:#0b0b0b;width:100%;padding:14px;font-size:16px">Start my plan</button>'+
   '<p style="margin:14px 0 6px;color:#cfcac2">Already have a plan? Paste your link or code:</p><label style="margin:0"><input id="codein" placeholder="your link or code" style="flex:1"><button data-a="usecode">Open</button></label></div>';
}
function linkBanner(){
  return '<div class="banner" id="linkban"><b>This is your personal link.</b> Your plan and edits are saved to it, even if you clear your history. Tap <b>Copy my link</b> and save it in Notes, then Share → Add to Home Screen.<br><br><button data-a="mylink" class="pill">Copy my link</button> <button data-a="gotit" class="pill">Got it</button></div>';
}
var SHOW_LINK=false;
function siteInit(){
  var q=new URLSearchParams(location.search).get("me"), code=q&&/^[a-z0-9]{8,32}$/.test(q)?q:null;
  if(!code){ try{ var last=localStorage.getItem("fightplan_code"); if(last&&/^[a-z0-9]{8,32}$/.test(last)) code=last; }catch(e){} }
  if(!code){ welcome(); return; }
  useCode(code);
  app.innerHTML='<h1>Fight &amp; Mass Training Plan</h1><p style="color:var(--mute)">Loading your plan…</p>';
  var done=false, cached=loadLocal();
  var timer=setTimeout(function(){ if(done) return; done=true; if(cached){ EDITS=cached; if(EDITS.start) START=EDITS.start; paint(); toast("Offline: showing your saved copy"); } else { app.innerHTML='<h1>Fight &amp; Mass Training Plan</h1><p>Can\'t reach your plan right now. Check your connection and reopen this page.</p>'; } },8000);
  fetch("/api/plan?id="+code).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
    if(done) return; done=true; clearTimeout(timer);
    if(j&&j.data&&typeof j.data==="object"){ EDITS=j.data; EDITS.ov=EDITS.ov||{}; }
    else { EDITS=cached||{ov:{},start:thisMonday()}; SHOW_LINK=true; saveEdits(); }
    if(EDITS.start) START=EDITS.start; else { EDITS.start=START=thisMonday(); saveEdits(); }
    try{ localStorage.setItem(EDIT_KEY,JSON.stringify(EDITS)); }catch(e){}
    paint();
  }).catch(function(){ if(done) return; clearTimeout(timer); done=true;
    if(cached){ EDITS=cached; if(EDITS.start) START=EDITS.start; paint(); toast("Offline: showing your saved copy"); }
    else app.innerHTML='<h1>Fight &amp; Mass Training Plan</h1><p>Can\'t reach your plan right now. Check your connection and reopen this page.</p>';
  });
}
if(SITE) siteInit(); else paint();
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
app.addEventListener("click",function(e){
  var sm=e.target.closest("summary"); if(!sm||!app.contains(sm)) return;
  e.preventDefault();
  var d=sm.parentElement,box=d.querySelector(":scope>.inner");
  if(!box||reduce){d.open=!d.open;return}
  if(d._anim){d._anim.cancel()}
  var opening=!d.open||d._closing;
  if(opening){ d._closing=false;d.open=true; var h=box.scrollHeight;
    d._anim=box.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:Math.min(420,180+h*0.12),easing:"cubic-bezier(.2,.7,.2,1)"});
    d._anim.onfinish=function(){d._anim=null};
  } else { d._closing=true; var h2=box.offsetHeight;
    d._anim=box.animate([{height:h2+"px",opacity:1},{height:"0px",opacity:0}],{duration:Math.min(320,160+h2*0.08),easing:"cubic-bezier(.4,0,.2,1)"});
    d._anim.onfinish=function(){d.open=false;d._closing=false;d._anim=null};
  }
});
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},1600)}
function showModal(text){document.getElementById("mtext").value=text;document.getElementById("modal").classList.add("on")}
document.getElementById("mclose").onclick=function(){document.getElementById("modal").classList.remove("on")};
app.addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]"); if(!b) return; var a=b.getAttribute("data-a");
  if(a!=="reset") RESET_ARM=false;
  if(a==="start"){ var nc=newCode(); useCode(nc); EDITS={ov:{},start:thisMonday()}; START=EDITS.start; SHOW_LINK=true; saveEdits(); paint(); return; }
  if(a==="usecode"){ var v=(document.getElementById("codein").value||"").trim(), m=v.match(/me=([a-z0-9]{8,32})/)||v.match(/^([a-z0-9]{8,32})$/); if(!m){ toast("That link doesn't look right"); return; } location.href="?me="+m[1]; return; }
  if(a==="gotit"){ SHOW_LINK=false; paint(); return; }
  if(a==="mylink"){ var L=myLink(); try{ navigator.clipboard.writeText(L).then(function(){toast("Your link is copied")},function(){showModal(L)}); }catch(err){ showModal(L); } return; }
  if(a==="edit"){ EDITING=!EDITING; paint(); if(EDITING){ var ws=app.querySelector('details[data-key="weights"]'); if(ws) ws.open=true; window.scrollTo(0,0); } else toast("Saved"); return; }
  if(a==="inc"||a==="dec"){
    var k=b.getAttribute("data-k"), v=+b.getAttribute("data-v"), st=+b.getAttribute("data-s")||5;
    var nv=Math.max(0,v+(a==="inc"?st:-st)); var w=R.c.w;
    EDITS.ov[k]=EDITS.ov[k]||{}; EDITS.ov[k][w]=nv;
    if(!saveEdits()) toast("Couldn't save on this browser");
    paint(); return;
  }
  if(a==="reset"){ if(RESET_ARM){ EDITS={ov:{}}; saveEdits(); location.reload(); return; } RESET_ARM=true; paint(); return; }
  if(a==="open") document.querySelectorAll("details").forEach(function(x){x.open=true});
  if(a==="close") document.querySelectorAll("details").forEach(function(x){x.open=false});
  if(a==="copy"){ var t=copyText(R.c);
    try{ navigator.clipboard.writeText(t).then(function(){toast("Workout copied")},function(){showModal(t)}); }catch(err){ showModal(t); } }
});
})();
</script>
